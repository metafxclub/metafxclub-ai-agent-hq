name: Verify safe runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # The exhaustive Windows suite currently covers more than 2,000 tests.
    # Leave enough room for a cold pinned-dependency install on every
    # supported Python version instead of turning a slow runner into a false
    # release failure.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # Keep regression tests independent from skills/plugins already installed
      # in a developer profile. This mirrors a student's first clean install.
      CODEX_HOME: ${{ github.workspace }}\.ci-codex-home
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: เตรียม Runner dependency ที่ล็อกเวอร์ชัน
        shell: pwsh
        run: |
          python -m venv runner/.venv
          $pipEnvironmentNames = @(Get-ChildItem Env: | Where-Object { $_.Name -like "PIP_*" } | ForEach-Object { [string]$_.Name })
          foreach ($name in @($pipEnvironmentNames + @("REQUESTS_CA_BUNDLE", "CURL_CA_BUNDLE", "SSL_CERT_FILE", "SSL_CERT_DIR"))) {
            Remove-Item -LiteralPath ("Env:{0}" -f $name) -Force -ErrorAction SilentlyContinue
          }
          $env:PIP_CONFIG_FILE = "nul"
          $pipWheel = "installer/bootstrap/pip-26.2.1-py3-none-any.whl"
          $pipWheelHash = (Get-FileHash -LiteralPath $pipWheel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pipWheelHash -cne "71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e") {
            throw "Offline pip bootstrap SHA-256 mismatch"
          }
          .\runner\.venv\Scripts\python.exe -m pip --disable-pip-version-check install --no-index --no-deps --upgrade $pipWheel
          if ($LASTEXITCODE -ne 0) {
            throw "Offline pip bootstrap failed with exit code $LASTEXITCODE"
          }
          $pipVersion = (& .\runner\.venv\Scripts\python.exe -I -c "import pip; print(pip.__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or $pipVersion -cne "26.2.1") {
            throw "Expected verified pip 26.2.1, found '$pipVersion'"
          }
          .\runner\.venv\Scripts\python.exe -m pip --disable-pip-version-check install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --requirement requirements-runner.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned runner dependency installation failed with exit code $LASTEXITCODE"
          }
          .\runner\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned runner dependency check failed with exit code $LASTEXITCODE"
          }
      - name: ตรวจโครงสร้างและกฎความปลอดภัย
        shell: pwsh
        run: |
          .\scripts\run-regression-suite.ps1 `
            -PythonPath .\runner\.venv\Scripts\python.exe `
            -LogPath (Join-Path $env:RUNNER_TEMP "verify-regression-${{ matrix.python-version }}.log")
      - name: ตรวจไวยากรณ์ JavaScript
        run: node --check frontend/src/app/main.js
