name: Publish student release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: publish-student-release
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      CODEX_HOME: ${{ github.workspace }}\.ci-codex-home
    steps:
      - name: Check out compatibility source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify full runtime on supported Python
        shell: pwsh
        run: |
          python -m venv runner/.venv
          .\runner\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes --requirement requirements-runner.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned dependency installation failed on Python ${{ matrix.python-version }} with exit code $LASTEXITCODE"
          }
          .\runner\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned dependency check failed on Python ${{ matrix.python-version }} with exit code $LASTEXITCODE"
          }
          .\runner\.venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) {
            throw "Regression suite failed on Python ${{ matrix.python-version }} with exit code $LASTEXITCODE"
          }

  publish:
    needs: compatibility
    runs-on: windows-latest
    env:
      # The release gate must pass from a clean student-like Codex profile,
      # never because optional reference plugins exist on a developer machine.
      CODEX_HOME: ${{ github.workspace }}\.ci-codex-home
    steps:
      - name: Check out verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match the student runtime that exposed the SSL test-double
          # regression. The compatibility job above gates 3.10-3.14.
          python-version: "3.11"

      - name: Verify safe runtime
        shell: pwsh
        run: |
          python -m venv runner/.venv
          .\runner\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes --requirement requirements-runner.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned runner dependency installation failed with exit code $LASTEXITCODE"
          }
          .\runner\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned runner dependency check failed with exit code $LASTEXITCODE"
          }
          .\runner\.venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) {
            throw "Python regression suite failed with exit code $LASTEXITCODE"
          }
          node --check frontend/src/app/main.js
          if ($LASTEXITCODE -ne 0) {
            throw "Frontend syntax check failed with exit code $LASTEXITCODE"
          }

      - name: Build release package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must use semantic version format, for example 0.1.0"
          }

          $tag = "v$version"
          $archive = "Metafxclub-AI-Agent-HQ-$tag-Windows.zip"
          $checksum = "$archive.sha256"

          function Get-GitHubApiHttpStatus {
            param([object[]]$OutputLines)
            $outputText = @($OutputLines) -join "`n"
            if ($outputText -match '(?im)^HTTP/\S+\s+(\d{3})\b') {
              return [int]$Matches[1]
            }
            # gh writes API failures such as `gh: Not Found (HTTP 404)` to
            # stderr without an HTTP status-line on some runner versions.
            if ($outputText -match '(?i)\(HTTP\s+(\d{3})\)') {
              return [int]$Matches[1]
            }
            return $null
          }

          $existingRelease = $false
          $existingReleaseNeedsPublish = $false
          $existingTarget = $null
          $releaseView = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>&1
          $releaseViewExit = $LASTEXITCODE
          if ($releaseViewExit -eq 0) {
            $existingRelease = $true
            try {
              $releasePayload = ($releaseView -join "`n") | ConvertFrom-Json
              if ([string]$releasePayload.tag_name -cne $tag) {
                throw "tag_name mismatch"
              }
              $existingReleaseNeedsPublish = (
                $releasePayload.draft -eq $true -or
                [string]::IsNullOrWhiteSpace([string]$releasePayload.published_at)
              )
            }
            catch {
              throw "Release $tag exists but its GitHub API response is invalid."
            }
            git fetch --force origin "refs/tags/$tag`:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) {
              throw "Release $tag exists but its Git tag cannot be fetched for verification."
            }
            $existingTarget = (git rev-list -n 1 $tag).Trim()
            if ($existingTarget -and $existingTarget -cne $env:GITHUB_SHA) {
              throw "Release $tag already exists for '$existingTarget', not current SHA '$env:GITHUB_SHA'. Bump VERSION instead of reusing the tag."
            }
          }
          else {
            $httpStatus = Get-GitHubApiHttpStatus -OutputLines @($releaseView)
            if ($null -eq $httpStatus) {
              $statusProbe = gh api --include "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>&1
              $httpStatus = Get-GitHubApiHttpStatus -OutputLines @($statusProbe)
            }
            if ($httpStatus -ne 404) {
              throw "Unable to determine whether Release $tag already exists (HTTP $httpStatus): $releaseView"
            }
          }

          # Always build and smoke-test the exact current archive. An existing
          # release tag must never bypass package integrity verification.
          git archive --format=zip --prefix="Metafxclub-AI-Agent-HQ-$tag/" --output=$archive HEAD
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -LiteralPath $checksum -Encoding ascii

          # Test the exact ZIP layout and the installed Runtime before the
          # public Release is created. Source-only tests cannot detect a
          # root file that the installer forgot to copy.
          $smokeRoot = Join-Path $env:RUNNER_TEMP "metafxclub-release-smoke-$tag"
          $packageRoot = Join-Path $smokeRoot "Metafxclub-AI-Agent-HQ-$tag"
          Expand-Archive -LiteralPath $archive -DestinationPath $smokeRoot -Force
          foreach ($requiredFile in @(
              ".gitattributes",
              ".gitignore",
              "VERSION",
              "requirements-runner.txt",
              "installer\install.ps1",
              "2-SETUP-GOOGLE-HQ.bat",
              "docs\prompts\install-github-google-auto-th.md",
              "scripts\setup-google-oauth.ps1",
              "scripts\start-local-bridge.ps1",
              "backend\local-runner\configure_google_oauth_client.py",
              "backend\local-runner\google_oauth_store.py",
              "backend\local-runner\google_sheet_hub.py",
              "contracts\workflows\ea-factory-contract.json",
              "docs\research-sheet-hub-setup-th.md",
              "tests\test_release_candidate_preflight.py",
              "tests\test_runtime_integrity.py",
              "tests\fixtures\legacy_degraded_bridge.py",
              "scripts\run-bridge-watchdog-hidden.vbs",
              "artifacts\mt4-ai-council-ea-v2.18-enum-fail-closed-readiness\MetafxHQTradeGateway.mq4",
              "artifacts\mt4-ai-council-ea-v2.18-enum-fail-closed-readiness\MetafxHQTradeGateway.ex4",
              "artifacts\mt4-ai-council-ea-v2.18-enum-fail-closed-readiness\README_TH.md",
              "artifacts\mt4-ai-council-ea-v2.18-enum-fail-closed-readiness\AUDIT_TH.md",
              "artifacts\mt4-ai-council-ea-v2.18-enum-fail-closed-readiness\SHA256SUMS.txt",
              "artifacts\mt4-ai-council-ea-v2.18-enum-fail-closed-readiness\BUILD_LOG.txt",
              "artifacts\mt4-ai-council-ea-v2.18-enum-fail-closed-readiness\MANIFEST.json",
              "artifacts\mt4-ai-council-ea-v2.18-enum-fail-closed-readiness\COMPILE_PROOF.png"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $requiredFile) -PathType Leaf)) {
              throw "Release package is missing required file: $requiredFile"
            }
          }

            function Get-SmokePort {
              $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
              try {
                $listener.Start()
                return ([Net.IPEndPoint]$listener.LocalEndpoint).Port
              }
              finally {
                $listener.Stop()
              }
            }
            function Start-DegradedFixture {
              param(
                [Parameter(Mandatory = $true)][string]$ScriptPath,
                [Parameter(Mandatory = $true)][int]$Port,
                [Parameter(Mandatory = $true)][string]$LogRoot
              )
              New-Item -ItemType Directory -Path $LogRoot -Force | Out-Null
              $pythonPath = (Get-Command python.exe -CommandType Application).Source
              $arguments = @(
                ('"{0}"' -f $ScriptPath), "--host", "127.0.0.1", "--port", ([string]$Port)
              )
              $process = Start-Process `
                -FilePath $pythonPath `
                -ArgumentList $arguments `
                -WorkingDirectory (Split-Path -Parent $ScriptPath) `
                -WindowStyle Hidden `
                -RedirectStandardOutput (Join-Path $LogRoot "fixture-stdout.log") `
                -RedirectStandardError (Join-Path $LogRoot "fixture-stderr.log") `
                -PassThru
              $deadline = [DateTime]::UtcNow.AddSeconds(20)
              do {
                $listenerIds = @(
                  Get-NetTCPConnection -LocalPort $Port -State Listen -ErrorAction SilentlyContinue |
                    Select-Object -ExpandProperty OwningProcess -Unique
                )
                if ($listenerIds.Count -eq 1 -and [int]$listenerIds[0] -eq [int]$process.Id) {
                  return $process
                }
                if ($process.HasExited) {
                  break
                }
                Start-Sleep -Milliseconds 250
              } while ([DateTime]::UtcNow -lt $deadline)
              throw "Degraded Bridge fixture did not own its requested listener."
            }
            function Assert-DegradedFixture {
              param([Parameter(Mandatory = $true)][int]$Port)
              $response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:$Port/api/health" `
                -Method Get `
                -SkipHttpErrorCheck `
                -TimeoutSec 3
              if ([int]$response.StatusCode -ne 503) {
                throw "Expected the legacy fixture to return HTTP 503/degraded."
              }
              $payload = $response.Content | ConvertFrom-Json
              if ([string]$payload.status -cne "degraded") {
                throw "Legacy fixture did not report degraded Health."
              }
            }
            function Initialize-LegacyInstall {
              param(
                [Parameter(Mandatory = $true)][string]$LocalAppData,
                [Parameter(Mandatory = $true)][int]$Port
              )
              $installed = Join-Path $LocalAppData "Metafxclub\AI-Agent-HQ"
              $installedServer = Join-Path $installed "backend\local-runner\bridge_server.py"
              $runtime = Join-Path $installed "data\runtime"
              New-Item -ItemType Directory -Path (Split-Path -Parent $installedServer) -Force | Out-Null
              New-Item -ItemType Directory -Path (Join-Path $installed "scripts") -Force | Out-Null
              New-Item -ItemType Directory -Path $runtime -Force | Out-Null
              Copy-Item `
                -LiteralPath (Join-Path $packageRoot "tests\fixtures\legacy_degraded_bridge.py") `
                -Destination $installedServer `
                -Force
              Copy-Item `
                -LiteralPath (Join-Path $packageRoot "scripts\start-local-bridge.ps1") `
                -Destination (Join-Path $installed "scripts\start-local-bridge.ps1") `
                -Force
              [IO.File]::WriteAllText((Join-Path $installed "VERSION"), "0.9.2`n", $utf8NoBom)
              $endpoint = [ordered]@{
                version = 1
                host = "127.0.0.1"
                port = $Port
                url = "http://127.0.0.1:$Port/"
                health_url = "http://127.0.0.1:$Port/api/health"
                confirmed_at = "2026-08-01T00:00:00+00:00"
              }
              [IO.File]::WriteAllText(
                (Join-Path $runtime "bridge-endpoint.json"),
                ($endpoint | ConvertTo-Json -Depth 4) + [Environment]::NewLine,
                $utf8NoBom
              )
              $operatorMode = [ordered]@{
                version = "operator-mode-store-v1"
                mode = "manual_guarded"
                updatedAt = "2026-08-01T00:00:00+00:00"
                source = "contract_default"
              }
              [IO.File]::WriteAllText(
                (Join-Path $runtime "operator-mode.json"),
                ($operatorMode | ConvertTo-Json -Depth 4) + [Environment]::NewLine,
                $utf8NoBom
              )
              return $installed
            }

            $originalLocalAppData = $env:LOCALAPPDATA
            $utf8NoBom = New-Object Text.UTF8Encoding($false)
            $foreignProcess = $null
            $installedLifecycle = $null
            try {
              # Negative case: an arbitrary 503 listener is never accepted as an
              # owned HQ process and must remain alive after installer rejection.
              $foreignPort = Get-SmokePort
              $env:LOCALAPPDATA = Join-Path $smokeRoot "ForeignLocalAppData"
              $foreignScript = Join-Path $packageRoot "tests\fixtures\legacy_degraded_bridge.py"
              $foreignProcess = Start-DegradedFixture `
                -ScriptPath $foreignScript `
                -Port $foreignPort `
                -LogRoot (Join-Path $smokeRoot "foreign-logs")
              & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
                -File (Join-Path $packageRoot "installer\install.ps1") `
                -Port $foreignPort -EndpointConfirmed -SkipLaunch -SkipShortcuts -PackageSmoke
              if ($LASTEXITCODE -eq 0) {
                throw "Installer accepted a foreign HTTP 503 listener."
              }
              if ($foreignProcess.HasExited) {
                throw "Installer stopped a foreign listener during endpoint rejection."
              }
              Assert-DegradedFixture -Port $foreignPort
              Stop-Process -Id $foreignProcess.Id -Force
              $foreignProcess.WaitForExit(10000) | Out-Null
              $foreignProcess = $null

              # Positive case: reproduce a preserved v0.9.2 install whose exact
              # owned Bridge is listening but Health is degraded.
              $smokePort = Get-SmokePort
              $env:LOCALAPPDATA = Join-Path $smokeRoot "LocalAppData"
              $installedRoot = Initialize-LegacyInstall `
                -LocalAppData $env:LOCALAPPDATA `
                -Port $smokePort
              $legacyServer = Join-Path $installedRoot "backend\local-runner\bridge_server.py"
              $legacyProcess = Start-DegradedFixture `
                -ScriptPath $legacyServer `
                -Port $smokePort `
                -LogRoot (Join-Path $installedRoot "data\runtime\logs")
              Assert-DegradedFixture -Port $smokePort

              # Force one failure after publish. Last-good must be restored and
              # its previously degraded exact listener must be running again.
              & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
                -File (Join-Path $packageRoot "installer\install.ps1") `
                -Port $smokePort -EndpointConfirmed -PackageSmoke -PackageUpgradeSmoke `
                -PackageSmokeFailAfterPublish -SkipShortcuts -SkipAutostart -SkipGoogleSetup
              if ($LASTEXITCODE -eq 0) {
                throw "Forced rollback smoke unexpectedly succeeded."
              }
              if ((Get-Content -LiteralPath (Join-Path $installedRoot "VERSION") -Raw).Trim() -cne "0.9.2") {
                throw "Last-good VERSION was not restored after the forced failure."
              }
              Assert-DegradedFixture -Port $smokePort

              # Run the real in-place upgrade. It must stop only the exact old
              # Bridge, publish the candidate, migrate state, and reach ready.
              & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
                -File (Join-Path $packageRoot "installer\install.ps1") `
                -Port $smokePort -EndpointConfirmed -PackageSmoke -PackageUpgradeSmoke `
                -SkipShortcuts -SkipAutostart -SkipGoogleSetup
              if ($LASTEXITCODE -ne 0) {
                throw "Release ZIP legacy-listener upgrade smoke failed with exit code $LASTEXITCODE"
              }

              foreach ($requiredInstalledFile in @(".gitattributes", ".gitignore", "VERSION")) {
                if (-not (Test-Path -LiteralPath (Join-Path $installedRoot $requiredInstalledFile) -PathType Leaf)) {
                  throw "Installed Runtime is missing required file: $requiredInstalledFile"
                }
              }
              $installedVersion = (Get-Content -LiteralPath (Join-Path $installedRoot "VERSION") -Raw).Trim()
              if ($installedVersion -cne $version) {
                throw "Installed Runtime version '$installedVersion' does not match Release '$version'"
              }

              $lifecyclePath = Join-Path $installedRoot "scripts\start-local-bridge.ps1"
              $installedLifecycle = $lifecyclePath
              $healthProbeStarted = $true
              try {
                $health = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:$smokePort/api/health" `
                  -Method Get `
                  -TimeoutSec 5
                if ($health.ok -ne $true -or [string]$health.status -cne "ready") {
                  throw "Legacy operator-mode upgrade smoke did not reach ready Health."
                }
              }
              finally {
                if ($healthProbeStarted) {
                  & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
                    -File $lifecyclePath -Action Stop -Port $smokePort
                  if ($LASTEXITCODE -ne 0) {
                    throw "Legacy operator-mode upgrade smoke could not stop its verified Bridge."
                  }
                }
              }

              $persistedOperatorMode = Get-Content `
                -LiteralPath (Join-Path $installedRoot "data\runtime\operator-mode.json") `
                -Raw `
                -Encoding UTF8 | ConvertFrom-Json
              if (
                [string]$persistedOperatorMode.mode -cne "auto_guarded" -or
                [string]$persistedOperatorMode.source -cne "contract_default_migration"
              ) {
                throw "Legacy contract-default operator mode was not migrated to auto_guarded."
              }
              $migrationEvents = @(
                Get-Content `
                  -LiteralPath (Join-Path $installedRoot "data\runtime\bridge-audit.jsonl") `
                  -Encoding UTF8 |
                  ForEach-Object { $_ | ConvertFrom-Json } |
                  Where-Object { [string]$_.type -ceq "operator_mode.migrated" }
              )
              if ($migrationEvents.Count -ne 1) {
                throw "Legacy operator-mode migration audit count was $($migrationEvents.Count), expected exactly 1."
              }
              node --check (Join-Path $installedRoot "frontend\src\app\main.js")
              if ($LASTEXITCODE -ne 0) {
                throw "Installed Runtime frontend syntax check failed with exit code $LASTEXITCODE"
              }
            }
            finally {
              if ($foreignProcess -and -not $foreignProcess.HasExited) {
                Stop-Process -Id $foreignProcess.Id -Force -ErrorAction SilentlyContinue
              }
              if ($installedLifecycle -and (Test-Path -LiteralPath $installedLifecycle -PathType Leaf)) {
                & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
                  -File $installedLifecycle -Action Stop -Port $smokePort | Out-Null
              }
              $env:LOCALAPPDATA = $originalLocalAppData
            }

          # Verify the exact official commit before exposing the final public
          # semver tag. Students additionally require a published Release,
          # verified checksum assets, and the successful release status gate.
          $officialRepository = "https://github.com/metafxclub/metafxclub-ai-agent-hq.git"
          $remoteTagReference = "refs/tags/$tag"
          $remoteTagLines = @(git ls-remote --tags $officialRepository $remoteTagReference "$remoteTagReference^{}")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect public Git tag $tag before verified-source smoke."
          }
          $remoteDirectCommit = ""
          $remotePeeledCommit = ""
          foreach ($line in $remoteTagLines) {
            if ([string]$line -notmatch '^([A-Fa-f0-9]{40,64})\s+(.+)$') {
              continue
            }
            if ([string]$Matches[2] -ceq $remoteTagReference) {
              $remoteDirectCommit = [string]$Matches[1]
            }
            elseif ([string]$Matches[2] -ceq "$remoteTagReference^{}") {
              $remotePeeledCommit = [string]$Matches[1]
            }
          }
          $remoteTagCommit = if ($remotePeeledCommit) { $remotePeeledCommit } else { $remoteDirectCommit }
          if ($remoteTagCommit -and $remoteTagCommit -cne $env:GITHUB_SHA) {
            throw "Public Git tag $tag points to '$remoteTagCommit', not current SHA '$env:GITHUB_SHA'."
          }
          if ($existingRelease -and -not $remoteTagCommit) {
            throw "Release $tag exists but its public Git tag is missing."
          }

          $verifiedRoot = Join-Path $env:RUNNER_TEMP "metafxclub-verified-git-smoke-$tag"
          $verifiedClone = Join-Path $verifiedRoot "source"
          $verifiedLocalAppData = Join-Path $verifiedRoot "LocalAppData"
          $verifiedOriginalLocalAppData = $env:LOCALAPPDATA
          try {
            New-Item -ItemType Directory -Path $verifiedClone -Force | Out-Null
            git -C $verifiedClone init
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to initialize the pre-publish verification clone."
            }
            git -C $verifiedClone remote add origin $officialRepository
            git -C $verifiedClone fetch --depth 1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Official commit fetch failed before publishing $tag."
            }
            git -C $verifiedClone checkout --detach $env:GITHUB_SHA
            git -C $verifiedClone tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to prepare the local candidate tag for pre-publish verification."
            }

            # This ignored sentinel proves verified staging comes from the
            # commit archive, not from ignored files in the worktree.
            $ignoredSentinel = Join-Path $verifiedClone "data\runtime\ci-ignored-source-sentinel.txt"
            New-Item -ItemType Directory -Path (Split-Path -Parent $ignoredSentinel) -Force | Out-Null
            Set-Content -LiteralPath $ignoredSentinel -Value "must-not-enter-runtime" -Encoding ascii
            git -C $verifiedClone check-ignore --quiet -- "data/runtime/ci-ignored-source-sentinel.txt"
            if ($LASTEXITCODE -ne 0) {
              throw "Verified-source sentinel is not ignored as required by the staging test."
            }

            $verifiedListener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
            $verifiedListener.Start()
            $verifiedPort = ([Net.IPEndPoint]$verifiedListener.LocalEndpoint).Port
            $verifiedListener.Stop()
            $env:LOCALAPPDATA = $verifiedLocalAppData
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File (Join-Path $verifiedClone "installer\install.ps1") `
              -Port $verifiedPort -EndpointConfirmed -SkipLaunch -SkipShortcuts -SkipAutostart -PackageSmoke `
              -RequireVerifiedGitSource -PrePublishVerification `
              -ExpectedGitRepository $officialRepository `
              -ExpectedGitTag $tag `
              -ExpectedSourceVersion $version `
              -ExpectedGitCommit $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Verified official-commit installation smoke failed with exit code $LASTEXITCODE."
            }

            $verifiedInstalledRoot = Join-Path $verifiedLocalAppData "Metafxclub\AI-Agent-HQ"
            if (Test-Path -LiteralPath (Join-Path $verifiedInstalledRoot "data\runtime\ci-ignored-source-sentinel.txt")) {
              throw "Verified Git staging copied an ignored worktree file into Runtime."
            }
            node --check (Join-Path $verifiedInstalledRoot "frontend\src\app\main.js")
            if ($LASTEXITCODE -ne 0) {
              throw "Verified Git Runtime frontend syntax check failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            $env:LOCALAPPDATA = $verifiedOriginalLocalAppData
          }

          $tagCreatedByThisRun = $false
          $releaseCreatedByThisRun = $false
          $releaseCreationAmbiguous = $false
          try {
            if (-not $remoteTagCommit) {
              git tag --force $tag $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to create local Git tag $tag after pre-publish verification."
              }
              git push origin "refs/tags/$tag`:refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to publish Git tag $tag after pre-publish verification."
              }
              $tagCreatedByThisRun = $true
              $remoteTagCommit = $env:GITHUB_SHA
            }

            if (-not $existingRelease) {
              $notes = @'
          ชุดติดตั้ง Metafxclub AI Agent HQ สำหรับ Windows

          วิธีหลักสำหรับห้องเรียน — Prompt เดียวผ่าน Codex:
          1. ติดตั้ง Git for Windows และ Python 3.10-3.14 แบบ 64-bit จาก python.org พร้อม Add Python to PATH
          2. เปิด docs/prompts/install-github-google-auto-th.md ของ Tag รุ่นนี้
          3. เปลี่ยนเฉพาะ Google Client ID และ Path ของ Desktop OAuth JSON แล้ววาง Prompt ทั้งชุดใน Codex
          4. Codex จะ Clone exact Tag, ตรวจ Commit กับ GitHub, ติดตั้ง ตรวจ Health/หน้าเว็บ และเปิด http://127.0.0.1:4186/
          5. ผู้เรียนกดเชื่อมบัญชี Google และอนุญาตบัญชีของตนเองหนึ่งครั้งใน HQ

          วิธี ZIP เป็นทางเลือก Manual เท่านั้น:
          ดาวน์โหลด ZIP พร้อม .sha256, ตรวจ Hash, แตกไฟล์ แล้วใช้ 1-INSTALL-HQ.bat ตาม STUDENT-QUICKSTART-TH.md
          ห้ามใช้ Clone main + BAT เป็นขั้นตอนห้องเรียน เพราะไม่ได้ล็อก Tag/Commit แบบ Prompt อัตโนมัติ

          หลังติดตั้ง ระบบตรวจ Health, Codex และ Rate Limit ของบัญชีที่ Login อยู่ในเครื่องนั้น
          ระบบเริ่มต้นในโหมด Demo/Read-only และไม่รวม Token, Password, Auth, Log, Memory หรือข้อมูลส่วนตัวจากเครื่องผู้พัฒนา
          '@

              gh release create $tag $archive $checksum `
                --repo $env:GITHUB_REPOSITORY `
                --target $env:GITHUB_SHA `
                --title "Metafxclub AI Agent HQ $tag" `
                --notes $notes
              if ($LASTEXITCODE -ne 0) {
                # The API may have accepted the Release and assets even when
                # the CLI lost its final response. Probe before cleanup so a
                # transient network error cannot leave an orphan Release by
                # deleting only the already-published tag.
                $releaseCreationAmbiguous = $true
                $createdReleaseFound = $false
                for ($createdReleaseProbeAttempt = 1; $createdReleaseProbeAttempt -le 5; $createdReleaseProbeAttempt++) {
                  $createdReleaseView = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>&1
                  if ($LASTEXITCODE -eq 0) {
                    try {
                      $createdReleasePayload = ($createdReleaseView -join "`n") | ConvertFrom-Json
                      $createdReleaseFound = [string]$createdReleasePayload.tag_name -ceq $tag
                    }
                    catch {
                      $createdReleaseFound = $false
                    }
                    if ($createdReleaseFound) {
                      break
                    }
                  }
                  if ($createdReleaseProbeAttempt -lt 5) {
                    Start-Sleep -Seconds 3
                  }
                }
                if (-not $createdReleaseFound) {
                  # A failed probe is not proof that GitHub rejected the
                  # create request. Keep both the published tag and the
                  # ambiguous state so a delayed Release can never become an
                  # orphan whose tag was removed by cleanup. A later rerun
                  # will discover and repair the same-SHA Release.
                  throw "Release $tag could not be created or confirmed through the GitHub API; preserving its tag for a safe rerun."
                }
                gh release upload $tag $archive $checksum `
                  --repo $env:GITHUB_REPOSITORY `
                  --clobber
                if ($LASTEXITCODE -ne 0) {
                  throw "Release $tag was created after an ambiguous CLI response, but its assets could not be repaired."
                }
              }
              else {
                $releaseCreatedByThisRun = $true
              }
            } else {
              # Same-SHA reruns repair partial/corrupt assets rather than merely
              # reporting success for an incomplete existing Release.
              gh release upload $tag $archive $checksum `
                --repo $env:GITHUB_REPOSITORY `
                --clobber
              if ($LASTEXITCODE -ne 0) {
                throw "Release $tag exists at this SHA, but its assets could not be repaired."
              }
            }

            $verifyRoot = Join-Path $env:RUNNER_TEMP "metafxclub-release-verify-$tag"
            New-Item -ItemType Directory -Path $verifyRoot -Force | Out-Null
            $remoteArchive = Join-Path $verifyRoot $archive
            $remoteChecksum = Join-Path $verifyRoot $checksum
            $releaseDownloadReady = $false
            for ($releaseDownloadAttempt = 1; $releaseDownloadAttempt -le 8; $releaseDownloadAttempt++) {
              Remove-Item -LiteralPath $remoteArchive -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $remoteChecksum -Force -ErrorAction SilentlyContinue
              gh release download $tag `
                --repo $env:GITHUB_REPOSITORY `
                --dir $verifyRoot `
                --pattern $archive `
                --pattern $checksum `
                --clobber
              $releaseDownloadExitCode = $LASTEXITCODE
              if (
                $releaseDownloadExitCode -eq 0 -and
                (Test-Path -LiteralPath $remoteArchive -PathType Leaf) -and
                (Test-Path -LiteralPath $remoteChecksum -PathType Leaf)
              ) {
                try {
                  $remoteHash = (Get-FileHash -LiteralPath $remoteArchive -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
                  $remoteChecksumLine = (Get-Content -LiteralPath $remoteChecksum -Raw -ErrorAction Stop).Trim()
                  if ($remoteHash -ceq $hash -and $remoteChecksumLine -ceq "$hash  $archive") {
                    $releaseDownloadReady = $true
                    break
                  }
                }
                catch {
                  Write-Warning "Release asset read failed during verification attempt $releaseDownloadAttempt/8: $($_.Exception.Message)"
                }
              }
              if ($releaseDownloadAttempt -lt 8) {
                Write-Warning "Release assets are not readable with the expected checksum yet; retrying verification download ($releaseDownloadAttempt/8)."
                Start-Sleep -Seconds 5
              }
            }
            if (-not $releaseDownloadReady) {
              throw "Release $tag assets could not be downloaded with the verified local package checksum."
            }
            if ($existingReleaseNeedsPublish) {
              # A draft left by an interrupted/manual run is repairable, but it
              # must never receive the public success status while students
              # still cannot read it through /releases/tags/<tag>.
              gh release edit $tag `
                --repo $env:GITHUB_REPOSITORY `
                --draft=false
              if ($LASTEXITCODE -ne 0) {
                throw "Release $tag assets are valid, but its draft could not be published."
              }
            }

            $publishedReleaseView = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "Release $tag could not be read back after upload/publish."
            }
            try {
              $publishedRelease = ($publishedReleaseView -join "`n") | ConvertFrom-Json
            }
            catch {
              throw "Release $tag returned invalid JSON after upload/publish."
            }
            $publishedAssets = @($publishedRelease.assets)
            $publishedArchiveAssets = @($publishedAssets | Where-Object { [string]$_.name -ceq $archive -and [long]$_.size -gt 0 })
            $publishedChecksumAssets = @($publishedAssets | Where-Object { [string]$_.name -ceq $checksum -and [long]$_.size -gt 0 })
            if (
              [string]$publishedRelease.tag_name -cne $tag -or
              $publishedRelease.draft -ne $false -or
              [string]::IsNullOrWhiteSpace([string]$publishedRelease.published_at) -or
              $publishedArchiveAssets.Count -ne 1 -or
              $publishedChecksumAssets.Count -ne 1
            ) {
              throw "Release $tag is not a published, non-draft Release with both non-empty verified assets."
            }
            if ($existingRelease) {
              Write-Host "Release $tag already exists at the current SHA. Verified assets were uploaded with clobber; no duplicate release was created."
            }

            $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
              -f state=success `
              -f context=metafxclub/release `
              -f "description=Release $tag verified" `
              -f "target_url=$runUrl"
            if ($LASTEXITCODE -ne 0) {
              throw "Release status gate could not be published."
            }
          }
          catch {
            if (-not $existingRelease -and -not $releaseCreationAmbiguous) {
              $releaseRemovedOrNeverCreated = -not $releaseCreatedByThisRun
              if ($releaseCreatedByThisRun) {
                gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes | Out-Host
                if ($LASTEXITCODE -eq 0) {
                  $releaseRemovedOrNeverCreated = $true
                }
                else {
                  Write-Warning "Release $tag cleanup failed; preserving its Git tag to prevent an orphan Release."
                }
              }
              if ($tagCreatedByThisRun -and $releaseRemovedOrNeverCreated) {
                git push origin ":refs/tags/$tag" | Out-Host
              }
            }
            throw
          }
        env:
          GH_TOKEN: ${{ github.token }}
